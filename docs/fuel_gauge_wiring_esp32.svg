<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" font-family="Arial, Helvetica, sans-serif">
<rect width="1100" height="680" fill="#fff"/>
<text x="550" y="38" text-anchor="middle" font-size="24" font-weight="bold">Fuel gauge sender stand-in: ESP32-CAN-X2 + 2N7000 driver + IRLB8721 (tested)</text>

<!-- Cluster plug -->
<rect x="920" y="110" width="150" height="330" rx="8" fill="#eef3fb" stroke="#2b4a7a" stroke-width="2"/>
<text x="995" y="140" text-anchor="middle" font-size="17" font-weight="bold">Cluster</text>
<text x="995" y="160" text-anchor="middle" font-size="14">24-pin plug</text>
<circle cx="920" cy="190" r="7" fill="#c0392b"/>
<text x="935" y="187" font-size="15" font-weight="bold">Pin 2 (2U)</text>
<text x="935" y="206" font-size="13">sense, +11 V open</text>
<circle cx="920" cy="400" r="7" fill="#222"/>
<text x="935" y="397" font-size="15" font-weight="bold">Pin 1 (2W)</text>
<text x="935" y="416" font-size="13">return = ground</text>

<!-- Branch A: 470 ohm -->
<line x1="820" y1="190" x2="820" y2="250" stroke="#222" stroke-width="2"/>
<rect x="808" y="250" width="24" height="90" fill="#fff" stroke="#222" stroke-width="2"/>
<line x1="820" y1="340" x2="820" y2="400" stroke="#222" stroke-width="2"/>
<text x="836" y="290" font-size="15" font-weight="bold">470 Ω</text>
<text x="836" y="308" font-size="12">sets EMPTY</text>
<circle cx="820" cy="190" r="4"/><circle cx="820" cy="400" r="4"/>

<!-- Branch B: capacitor -->
<line x1="680" y1="190" x2="680" y2="282" stroke="#222" stroke-width="2"/>
<line x1="655" y1="282" x2="705" y2="282" stroke="#222" stroke-width="4"/>
<path d="M655 304 Q680 292 705 304" fill="none" stroke="#222" stroke-width="4"/>
<line x1="680" y1="298" x2="680" y2="400" stroke="#222" stroke-width="2"/>
<text x="661" y="272" font-size="16" font-weight="bold">+</text>
<text x="712" y="280" font-size="15" font-weight="bold">470 µF</text>
<text x="712" y="298" font-size="12">25 V+, stripe</text>
<text x="712" y="312" font-size="12">(−) to ground</text>
<circle cx="680" cy="190" r="4"/><circle cx="680" cy="400" r="4"/>

<!-- Branch C: 10 ohm + IRLB8721 -->
<line x1="460" y1="190" x2="460" y2="210" stroke="#222" stroke-width="2"/>
<rect x="448" y="210" width="24" height="60" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="480" y="236" font-size="15" font-weight="bold">10 Ω</text>
<text x="480" y="254" font-size="12">pulls toward FULL</text>
<line x1="460" y1="270" x2="460" y2="292" stroke="#222" stroke-width="2"/>
<circle cx="452" cy="318" r="30" fill="#fff" stroke="#222" stroke-width="2"/>
<line x1="460" y1="292" x2="460" y2="304" stroke="#222" stroke-width="2"/>
<line x1="446" y1="304" x2="460" y2="304" stroke="#222" stroke-width="2"/>
<line x1="446" y1="332" x2="460" y2="332" stroke="#222" stroke-width="2"/>
<line x1="460" y1="332" x2="460" y2="400" stroke="#222" stroke-width="2"/>
<line x1="446" y1="298" x2="446" y2="338" stroke="#222" stroke-width="3"/>
<line x1="438" y1="298" x2="438" y2="338" stroke="#222" stroke-width="2"/>
<text x="490" y="300" font-size="15" font-weight="bold">IRLB8721</text>
<text x="490" y="318" font-size="12">D = top (to 10 Ω)</text>
<text x="490" y="334" font-size="12">S = bottom (to ground)</text>
<text x="490" y="350" font-size="12">G = left</text>
<circle cx="460" cy="190" r="4"/><circle cx="460" cy="400" r="4"/>

<!-- IRLB gate node: 4.7k pull-up to 5 V, pulled down by the 2N7000 -->
<line x1="438" y1="318" x2="340" y2="318" stroke="#222" stroke-width="2"/>
<circle cx="340" cy="318" r="4"/>
<line x1="190" y1="200" x2="340" y2="200" stroke="#e67e22" stroke-width="3"/>
<line x1="340" y1="200" x2="340" y2="225" stroke="#222" stroke-width="2"/>
<rect x="328" y="225" width="24" height="60" fill="#fff" stroke="#222" stroke-width="2"/>
<line x1="340" y1="285" x2="340" y2="318" stroke="#222" stroke-width="2"/>
<text x="358" y="250" font-size="15" font-weight="bold">4.7 kΩ</text>
<text x="358" y="268" font-size="12">pull-up to 5 V</text>
<text x="215" y="192" font-size="13" fill="#e67e22">5 V</text>

<!-- 2N7000: drain to gate node, source to ground -->
<circle cx="332" cy="358" r="24" fill="#fff" stroke="#222" stroke-width="2"/>
<line x1="340" y1="318" x2="340" y2="346" stroke="#222" stroke-width="2"/>
<line x1="326" y1="346" x2="340" y2="346" stroke="#222" stroke-width="2"/>
<line x1="326" y1="370" x2="340" y2="370" stroke="#222" stroke-width="2"/>
<line x1="340" y1="370" x2="340" y2="400" stroke="#222" stroke-width="2"/>
<line x1="326" y1="340" x2="326" y2="376" stroke="#222" stroke-width="3"/>
<line x1="318" y1="340" x2="318" y2="376" stroke="#222" stroke-width="2"/>
<text x="362" y="362" font-size="15" font-weight="bold">2N7000</text>
<text x="362" y="378" font-size="12">D top, S bottom</text>
<circle cx="340" cy="400" r="4"/>

<!-- 2N7000 gate drive: 100 ohm from GPIO14, 10k to ground -->
<line x1="318" y1="358" x2="290" y2="358" stroke="#222" stroke-width="2"/>
<rect x="240" y="348" width="50" height="20" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="265" y="342" text-anchor="middle" font-size="14" font-weight="bold">100 Ω</text>
<line x1="240" y1="358" x2="190" y2="358" stroke="#2e7d32" stroke-width="3"/>
<line x1="300" y1="358" x2="300" y2="372" stroke="#222" stroke-width="2"/>
<circle cx="300" cy="358" r="4"/>
<rect x="292" y="372" width="16" height="22" fill="#fff" stroke="#222" stroke-width="2"/>
<line x1="300" y1="394" x2="300" y2="400" stroke="#222" stroke-width="2"/>
<text x="246" y="390" font-size="14" font-weight="bold">10 kΩ</text>
<circle cx="300" cy="400" r="4"/>

<!-- ESP32-CAN-X2 -->
<rect x="30" y="150" width="160" height="300" rx="8" fill="#eaf5ec" stroke="#2e7d32" stroke-width="2"/>
<text x="110" y="176" text-anchor="middle" font-size="17" font-weight="bold">ESP32-CAN-X2</text>
<circle cx="190" cy="200" r="7" fill="#e67e22"/>
<text x="175" y="205" text-anchor="end" font-size="15" font-weight="bold">5 V</text>
<text x="175" y="223" text-anchor="end" font-size="12">SV2 pin 14/15</text>
<circle cx="190" cy="358" r="7" fill="#2e7d32"/>
<text x="175" y="355" text-anchor="end" font-size="15" font-weight="bold">GPIO14</text>
<text x="175" y="373" text-anchor="end" font-size="12">SV1 pin 7 (PWM)</text>
<circle cx="80" cy="400" r="7" fill="#222"/>
<text x="95" y="422" font-size="15" font-weight="bold">GND</text>
<text x="95" y="439" font-size="12">SV2 pin 16-18</text>

<!-- Rails -->
<line x1="460" y1="190" x2="920" y2="190" stroke="#c0392b" stroke-width="3"/>
<line x1="80" y1="400" x2="920" y2="400" stroke="#222" stroke-width="3"/>
<text x="560" y="180" font-size="14" fill="#c0392b">sense line</text>
<text x="560" y="425" font-size="14">ground line</text>
<circle cx="80" cy="400" r="7" fill="#222"/>

<!-- Notes -->
<text x="40" y="480" font-size="15" font-weight="bold">Notes</text>
<text x="40" y="504" font-size="14">• The X2's 3.3 V pins left the IRLB8721 barely on, so the 2N7000 stage drives its gate from 5 V: GPIO14 high = 2N7000 on = IRLB8721 off.</text>
<text x="40" y="527" font-size="14">• That inverts the PWM, so FUEL_PWM_INVERT is 1 on the X2 (config.h default). At power-up the 4.7 kΩ holds the IRLB8721 on, so the needle may head to F.</text>
<text x="40" y="550" font-size="14">• IRLB8721 legs, printed face toward you, legs down: Gate, Drain, Source (left to right). The metal tab is also Drain: keep it clear of ground.</text>
<text x="40" y="573" font-size="14">• 2N7000 legs, flat face toward you, legs down: Source, Gate, Drain (left to right).</text>
<text x="40" y="596" font-size="14">• Ground to an X2 GND pin (SV2 16-18), not power ground. PIN_FUEL_SENDER is 14 on this board.</text>
<text x="40" y="619" font-size="14">• Electrolytic polarity matters: + to pin 2 (sense), striped (−) leg to pin 1 / ground. Quarter-watt resistors are fine (max ~32 mA).</text>
<text x="40" y="642" font-size="14">• Bench readings: 160 Ω = E, 54 Ω = half, 16.8 Ω = F (judge after a power cycle). Use #ohms N to set the stand-in directly.</text>
</svg>
