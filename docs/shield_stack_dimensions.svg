<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1300" viewBox="0 0 1240 1300" font-family="Arial, Helvetica, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#333"/></marker>
</defs>
<rect width="1240" height="1300" fill="#fff"/>
<text x="620" y="36" text-anchor="middle" font-size="24" font-weight="bold">Mega 2560 + two Seeed CAN-BUS shields: outline (mm)</text>
<text x="620" y="62" text-anchor="middle" font-size="14" fill="#a33">Mega from Arduino's drawing; shield from Seeed's CAN-BUS Shield V2.0 drawing (A1.0). Gap between boards is estimated; check with calipers.</text>

<!-- TOP VIEW: scale 8 px/mm, origin at (150, 520) = Mega lower-left (USB end on left) -->
<text x="210" y="105" font-size="18" font-weight="bold">Top view</text>
<!-- Mega 101.6 x 53.3 -> 813 x 426 px; top-left y = 520-426 = 94 -> shift origin to y 560 -->
<g transform="translate(210,560)">
  <rect x="0" y="-426" width="813" height="426" fill="#e3f0f7" stroke="#1f5f8b" stroke-width="2"/>
  <text x="681" y="-200" text-anchor="middle" font-size="16" fill="#1f5f8b" font-weight="bold">Arduino Mega 2560</text>
  <!-- USB and DC jacks at left edge -->
  <rect x="-50" y="-370" width="140" height="96" fill="#ccc" stroke="#666"/>
  <text x="20" y="-316" text-anchor="middle" font-size="12">USB-B</text>
  <rect x="-15" y="-90" width="110" height="72" fill="#ccc" stroke="#666"/>
  <text x="40" y="-48" text-anchor="middle" font-size="12">DC jack</text>
  <!-- Shield footprint 68.6 x 53.3 -> 549 x 426 aligned at x=0 -->
  <rect x="0" y="-426" width="549" height="426" fill="#eaf5ec" fill-opacity="0.55" stroke="#2e7d32" stroke-width="3" stroke-dasharray="10 5"/>
  <text x="300" y="-340" text-anchor="middle" font-size="16" fill="#2e7d32" font-weight="bold">CAN-BUS shields (both, stacked)</text>
  <!-- DB9 overhang ~6 mm past USB end -->
  <rect x="-45" y="-260" width="96" height="250" fill="#f6e6c8" stroke="#9a6a12" stroke-width="2"/>
  <text x="3" y="-130" text-anchor="middle" font-size="13" fill="#9a6a12" transform="rotate(-90 3 -130)">DB9 (overhangs 5.6)</text>
  <!-- Mounting holes (Arduino Mega drawing) -->
  <g fill="#fff" stroke="#1f5f8b" stroke-width="2">
    <circle cx="111.8" cy="-20.3" r="13"/><circle cx="121.9" cy="-406.4" r="13"/>
    <circle cx="528.3" cy="-61" r="13"/><circle cx="528.3" cy="-284.5" r="13"/>
    <circle cx="721.4" cy="-406.4" r="13"/><circle cx="772.2" cy="-20.3" r="13"/>
  </g>
  <g font-size="11" fill="#1f5f8b">
    <text x="128" y="-28">(14.0, 2.5)</text><text x="140" y="-385">(15.2, 50.8)</text>
    <text x="545" y="-56">(66.0, 7.6)</text><text x="545" y="-280">(66.0, 35.6)</text>
    <text x="740" y="-385">(90.2, 50.8)</text><text x="700" y="-40">(96.5, 2.5)</text>
  </g>
  <!-- dimensions -->
  <line x1="0" y1="40" x2="813" y2="40" stroke="#333" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="0" y1="5" x2="0" y2="50" stroke="#333"/><line x1="813" y1="5" x2="813" y2="50" stroke="#333"/>
  <text x="406" y="62" text-anchor="middle" font-size="15" font-weight="bold">101.6 (Mega)</text>
  <line x1="0" y1="90" x2="549" y2="90" stroke="#2e7d32" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="549" y1="5" x2="549" y2="100" stroke="#2e7d32" stroke-dasharray="4 3"/>
  <text x="275" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e7d32">68.6 (shield board)</text>
  <line x1="-45" y1="140" x2="549" y2="140" stroke="#9a6a12" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="-45" y1="-5" x2="-45" y2="150" stroke="#9a6a12" stroke-dasharray="4 3"/>
  <text x="250" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a6a12">74.2 overall, with DB9</text>
  <line x1="860" y1="-426" x2="860" y2="0" stroke="#333" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="818" y1="-426" x2="870" y2="-426" stroke="#333"/><line x1="818" y1="0" x2="870" y2="0" stroke="#333"/>
  <text x="872" y="-205" font-size="15" font-weight="bold">53.3</text>
  <text x="872" y="-187" font-size="12">(Mega and shields)</text>
  <text x="0" y="195" font-size="12">Hole positions from the Mega's lower-left corner (USB end left). The shield's holes are at (15.2, 50.8), (66.0, 7.6) and (66.0, 35.6),</text><text x="0" y="213" font-size="12">the same as the Mega's, so standoffs can pass through all three boards.</text>
</g>

<!-- SIDE VIEW: scale 8 px/mm, base line y=900 -->
<text x="210" y="800" font-size="18" font-weight="bold">Side view (from the long edge)</text>
<g transform="translate(210,1200)">
  <rect x="0" y="-13" width="813" height="13" fill="#1f5f8b"/>
  <text x="820" y="-2" font-size="13">Mega PCB 1.6</text>
  <rect x="-50" y="-101" width="140" height="88" fill="#ccc" stroke="#666"/>
  <text x="20" y="-50" text-anchor="middle" font-size="12">USB-B ~11</text>
  <rect x="100" y="-101" width="420" height="88" fill="#333" opacity="0.12"/>
  <text x="310" y="-52" text-anchor="middle" font-size="12" fill="#555">headers, ≈ 11</text>
  <rect x="0" y="-114" width="549" height="13" fill="#2e7d32"/>
  <text x="560" y="-104" font-size="13">Shield 1 (HS-CAN, CS D9)</text>
  <!-- shield 1 DB9 14.7 and Phoenix header + plug 7.7 above the PCB -->
  <rect x="-45" y="-232" width="96" height="118" fill="#f6e6c8" stroke="#9a6a12"/>
  <text x="3" y="-170" text-anchor="middle" font-size="12" fill="#9a6a12">DB9</text>
  
  
  <rect x="80" y="-176" width="90" height="62" fill="#ddd" stroke="#666"/>
  <text x="125" y="-148" text-anchor="middle" font-size="11">header</text><text x="125" y="-134" text-anchor="middle" font-size="11">+ plug</text>
  <rect x="200" y="-234" width="330" height="120" fill="#333" opacity="0.12"/>
  <text x="365" y="-200" text-anchor="middle" font-size="12" fill="#555">stacking gap ≥ 14.7</text>
  <rect x="0" y="-247" width="549" height="13" fill="#2e7d32"/>
  <text x="560" y="-237" font-size="13">Shield 2 (MS-CAN, CS D10, D2 pin cut)</text>
  
  
  <rect x="80" y="-309" width="90" height="62" fill="#ddd" stroke="#666"/>
  <rect x="-45" y="-365" width="96" height="118" fill="#f6e6c8" stroke="#9a6a12"/>
  <text x="3" y="-302" text-anchor="middle" font-size="12" fill="#9a6a12">DB9</text>
  <!-- clearance -->
  <text x="180" y="-262" font-size="13" fill="#2e7d32" font-weight="bold">Lab checked: shield 1's DB9 (14.7) fits under shield 2, so the real gap is at least that</text>
  <!-- dims -->
  <line x1="-110" y1="0" x2="-110" y2="-365" stroke="#333" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="-115" y1="0" x2="-60" y2="0" stroke="#333"/><line x1="-115" y1="-365" x2="-50" y2="-365" stroke="#333"/>
  <text x="-118" y="-180" text-anchor="end" font-size="15" font-weight="bold">≈ 45.6</text>
  <line x1="700" y1="-13" x2="700" y2="-101" stroke="#333" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="708" y="-52" font-size="12">≈ 11 board gap</text>
  <line x1="660" y1="-114" x2="660" y2="-176" stroke="#9a6a12" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="170" y1="-176" x2="665" y2="-176" stroke="#9a6a12" stroke-dasharray="3 3"/>
  <text x="668" y="-150" font-size="12" fill="#9a6a12">7.7 header + plug</text>
  <text x="-60" y="35" font-size="12">From Seeed's drawing: PCB 1.6, DB9 14.7 above the PCB. Phoenix 1803277 header 7.25 tall, about 7.7 with the 5447861 plug in.</text>
  <text x="-60" y="55" font-size="12">The shield-to-shield gap is drawn at 15 (Lab found the DB9 fits); the Mega-to-shield gap is an 11 estimate. Measure both to firm up the height.</text>
  <text x="-60" y="75" font-size="12">The plug hangs about 3.4 below the PCB past the header, so check it clears what's under it. Tape the Mega's USB-B jack.</text>
</g>
</svg>
